# Lakebase Postgres control plane — DAB resources (field shapes corrected against
# the live API from the first deploy: project uses flat display_name, catalog uses
# postgres_database + branch, roles use flat identity fields. The project
# auto-creates its `production` branch + `primary` endpoint + `databricks_postgres`
# database, so those are NOT declared here.)
resources:

  # Top-level project. Auto-creates production branch + primary endpoint + db.
  postgres_projects:
    northpeak:
      project_id: northpeak
      display_name: "NorthPeak Retail"

  # UC registration catalog for this project (Postgres → UC).
  postgres_catalogs:
    northpeak_uc:
      catalog_id: northpeak_lakebase
      postgres_database: databricks_postgres
      branch: projects/northpeak/branches/production

  # NOTE: no postgres_roles here. The project creator (otto.jaaskelainen) already
  # has a Postgres role with the same postgres_role name, so declaring another with
  # the same identity fails ("role with that name already exists", even with
  # replace_existing, which keys on role_id not the postgres_role name). The
  # migration job runs as that creator identity, which has schema-create access.

  # Dev branch off production (copy-on-write), 7-day TTL.
  postgres_branches:
    dev_otto:
      branch_id: dev-otto
      parent: projects/northpeak
      source_branch: projects/northpeak/branches/production
      ttl: "604800s"

  # Scale-to-zero endpoints (suspend 300s). NB: the project auto-creates the
  # production `primary` endpoint with a 86400s (24h!) suspend timeout by
  # default — adopt+update it here so a fresh deploy pins 5-min scale-to-zero
  # (otherwise it idles at 1 CU for a full day before suspending = real cost).
  postgres_endpoints:
    production_primary:
      endpoint_id: primary
      parent: projects/northpeak/branches/production
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      replace_existing: true
      autoscaling_limit_min_cu: 1
      autoscaling_limit_max_cu: 1
      suspend_timeout_duration: "300s"
    dev_otto_primary:
      endpoint_id: primary
      parent: projects/northpeak/branches/dev-otto
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      # The dev-otto branch auto-creates a `primary` endpoint; adopt+update it
      # (to apply scale-to-zero) instead of failing on "already exists".
      replace_existing: true
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 1
      suspend_timeout_duration: "300s"

  # SNAPSHOT sync: UC gold_open_shortfalls → Postgres public.gold_open_shortfalls.
  postgres_synced_tables:
    open_shortfalls_sync:
      synced_table_id: northpeak_lakebase.public.gold_open_shortfalls
      source_table_full_name: ${var.catalog}.${var.schema}.gold_open_shortfalls
      primary_key_columns:
        - store_id
        - product_id
      scheduling_policy: SNAPSHOT
      branch: projects/northpeak/branches/production
      postgres_database: databricks_postgres
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${var.schema}
