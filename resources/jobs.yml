# In-database migration runner: applies lakebase/migrations/*.sql to the
# deployed Lakebase project. Run AFTER the project exists (and after the user
# enables per-project Search Beta) — see the deploy runbook.
resources:
  jobs:
    lakebase_migrate:
      name: "[NorthPeak] Lakebase in-DB migrations"
      description: "Applies northpeak.* schema + search DDL to the Lakebase project (idempotent)."
      tasks:
        - task_key: apply_migrations
          spark_python_task:
            python_file: ../lakebase/apply_migrations.py
            parameters:
              - "--project"
              - "northpeak"
              - "--user"
              - "${workspace.current_user.userName}"
              # __file__ is undefined in a spark_python_task; pass the synced
              # migrations dir explicitly (files root = ${workspace.file_path}).
              - "--migrations-dir"
              - "${workspace.file_path}/lakebase/migrations"
          environment_key: sdk_default
      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - "psycopg[binary]"
              # Pin >=0.81 so w.postgres exists (serverless base ships an older
              # SDK; an unversioned dep doesn't force the upgrade).
              - "databricks-sdk>=0.133.0"
