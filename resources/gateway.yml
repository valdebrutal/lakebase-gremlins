# AI Gateway (Build 3) — governed via a Unity AI Gateway MODEL SERVICE
# (otto_demo.northpeak_gateway.northpeak_ai_gateway → system.ai.gpt-oss-120b).
#
# The model service is a Unity Catalog securable, NOT a serving endpoint / DAB
# resource — it's created by gateway/setup_gateway.sh (`databricks ai-gateway
# create-model-service`), like the metric view + guardrail function. The app
# calls it at /ai-gateway/mlflow/v1 by its fully-qualified name (AGENT_MODEL).
# Guardrails (service policies) + inference table attach to the model service and
# require the account-level "Unity AI Gateway" beta (account console → Previews).
# This bundle file manages only the gateway schema + the guardrail-function job.
resources:
  schemas:
    gateway_schema:
      catalog_name: ${var.catalog}
      name: northpeak_gateway
      comment: "Holds the AI Gateway inference table + the guard_block_all_data policy fn."

  jobs:
    gateway_setup:
      name: "[NorthPeak] AI Gateway — guardrail function"
      description: "Creates the guard_block_all_data UC function in otto_demo.northpeak_gateway."
      tasks:
        - task_key: create_guardrail
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              # Paths in resources/*.yml resolve relative to THIS file's dir
              # (resources/), not the bundle root — verified in Task 5. So use
              # ../ to reach the repo-root gateway/ dir. VERIFY after writing:
              # `databricks bundle validate -t sandbox -o json` must show this
              # path resolving under `…/files/gateway/sandbox_guardrail.sql`.
              path: ../gateway/sandbox_guardrail.sql
